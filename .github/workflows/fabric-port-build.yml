name: Fabric 1.20.1 Port Build

on:
  push:
    branches:
      - fabric-1.20.1-port
  pull_request:
    branches:
      - fabric-1.20.1-port

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build
        run: bash ./gradlew build --stacktrace
